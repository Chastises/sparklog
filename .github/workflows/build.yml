name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Restore signing key (if the secret exists)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/sparklog.keystore"
            echo "SPARKLOG_KEYSTORE_FILE=$RUNNER_TEMP/sparklog.keystore" >> "$GITHUB_ENV"
            echo "SPARKLOG_KEYSTORE_PASSWORD=sparklog" >> "$GITHUB_ENV"
            echo "SPARKLOG_KEY_ALIAS=sparklog" >> "$GITHUB_ENV"
          else
            echo "No signing secret set; using the default debug key"
          fi
      - run: gradle assembleDebug --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sparklog.apk
          gh release create "build-${{ github.run_number }}" sparklog.apk \
            --title "Build ${{ github.run_number }}" --notes "Automated debug build" --latest
